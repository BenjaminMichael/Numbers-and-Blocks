<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Numberblock Drop Game</title>
  <style>
    :root {
      /* The game is dark in every theme, so these tokens are the same everywhere. */
      --bg: #1a1a2e;
      --board: #0f3460;
      --gold: #ffde59;
      --cyan: #00f2fe;
      --muted: #a0a0a0;
      --danger: #ff4757;
      color-scheme: dark;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    html {
      height: 100%;
      background-color: var(--bg);
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--bg);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Header and board share one column, so the header always lines up with the board's edges. */
    .game {
      display: flex;
      flex-direction: column;
    }

    .header {
      width: 0;                    /* follows the board's width instead of stretching it */
      min-width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
      padding: 0 2px;
    }

    /* Mode buttons on the left, score on the right */
    .status {
      width: 0;
      min-width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      padding: 0 2px;
    }

    .modes {
      display: inline-flex;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 2px;
    }

    .mode-btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: bold;
      padding: 5px 12px;
      border: none;
      border-radius: 14px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
    }

    .mode-btn[aria-pressed="true"] {
      background: var(--cyan);
      color: var(--bg);
    }

    .mode-btn:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 1px;
    }

    .title-block {
      min-width: 0;                /* lets the title wrap on very narrow screens instead of overflowing */
    }

    .title {
      font-size: clamp(13px, 4vw, 17px);
      font-weight: bold;
      color: var(--gold);
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .score-board {
      font-size: 16px;
      color: var(--cyan);
      white-space: nowrap;
    }

    .new-game-btn {
      flex-shrink: 0;
      padding: 8px 16px;
      font-size: 15px;
      font-weight: bold;
      font-family: inherit;
      background-color: var(--gold);
      color: var(--bg);
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 3px 5px rgba(0,0,0,0.3);
      transition: transform 0.1s;
    }

    .new-game-btn:active {
      transform: scale(0.95);
    }

    .new-game-btn:focus-visible,
    .restart-btn:focus-visible {
      outline: 3px solid var(--cyan);
      outline-offset: 2px;
    }

    .game-container {
      position: relative;
      border: 4px solid var(--gold);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      background-color: var(--board);
    }

    /* The board is 10 x 18 cells plus a little room for the cubes' top and right faces.
       The script sets --board-w and --board-ar to match; it shrinks to fit short or narrow screens. */
    canvas {
      display: block;
      border-radius: 4px;
      aspect-ratio: var(--board-ar, 0.5623);
      height: auto;
      width: min(var(--board-w, 370px), calc(100vw - 24px));
      width: min(
        var(--board-w, 370px),
        calc(100vw - 24px),
        calc((100dvh - 170px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * var(--board-ar, 0.5623))
      );
    }

    .instruction {
      margin-top: 10px;
      font-size: 14px;
      color: var(--muted);
      text-align: center;
      padding: 0 12px;
    }

    .game-over-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      display: none;
    }

    .game-over-title {
      font-size: 32px;
      color: var(--danger);
      margin-bottom: 10px;
    }

    .restart-btn {
      padding: 10px 20px;
      font-size: 18px;
      font-weight: bold;
      background-color: var(--gold);
      color: var(--bg);
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.1s, background-color 0.2s;
    }

    .restart-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="game">
    <div class="header">
      <div class="title-block">
        <div class="title">Numberblock Drop</div>
      </div>
      <button class="new-game-btn" onclick="resetGame(); this.blur()">New Game</button>
    </div>

    <div class="status">
      <div class="modes" role="group" aria-label="Game mode">
        <button class="mode-btn" data-mode="doubles" aria-pressed="true" onclick="setMode('doubles'); this.blur()">Doubles</button>
        <button class="mode-btn" data-mode="squares" aria-pressed="false" onclick="setMode('squares'); this.blur()">Squares</button>
      </div>
      <div class="score-board">Score: <span id="score">0</span></div>
    </div>

    <div class="game-container">
      <canvas id="gameCanvas" width="370" height="658"></canvas>
      <div id="gameOver" class="game-over-overlay">
        <div class="game-over-title">Game Over!</div>
        <button class="restart-btn" onclick="resetGame()">Play Again</button>
      </div>
    </div>
  </div>

  <div class="instruction" id="instruction"></div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElem = document.getElementById('score');
    const gameOverElem = document.getElementById('gameOver');
    const instructionElem = document.getElementById('instruction');

    // --- BOARD ---
    // An invisible grid. Everything snaps to it, but nothing draws it.
    const COLS = 10;
    const ROWS = 18;
    const CELL = 36;                 // px per grid square
    const W = COLS * CELL;           // the grid itself
    const H = ROWS * CELL;
    const DEPTH = 10;                // how far back each voxel cube reaches (px), up and to the right
    const CW = W + DEPTH;            // the canvas leaves room for the cubes' top and right faces
    const CH = H + DEPTH;

    // Render at the screen's pixel density so the blocks stay crisp on phones.
    const DPR = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = CW * DPR;
    canvas.height = CH * DPR;
    document.documentElement.style.setProperty('--board-w', CW + 'px');
    document.documentElement.style.setProperty('--board-ar', String(CW / CH));

    const DROP_SPEED = 45;           // rows per second while a block is falling
    const STEP_MS = 80;              // pace of blocks settling and merging
    const SHOW_GHOST = true;         // faint outline of where the block will land

    // Jelly feel. Bigger JELLY = wobblier blocks (0 turns the jiggle off).
    const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    const JELLY = REDUCED ? 0.4 : 1;
    const KICK_SQUASH = 7.5;          // how hard a landing squashes a block (height fraction per second)
    const KICK_SWAY = 210;           // how hard a bump shoves a block sideways (px per second)
    const FALL_STRETCH = 0.12;       // blocks stretch a little while they fall
    const LAND_IMPACT = 0.55;        // landing strength for blocks that fall after a merge (a dropped block is 1)

    let score = 0;
    let phase = 'aim';               // 'aim' | 'drop' | 'settle' | 'over'
    let grid = makeGrid();           // grid[row][col] = id of the block in that square (0 = empty)
    let pieces = new Map();          // id -> { id, value, cells: [[row, col], ...], dy, pop }
    let nextId = 1;
    let active = null;               // the block you are currently aiming
    let settleTimer = 0;

    // Numberblock colors
    const NUMBERBLOCKS = {
      1:    { color: "#FF3333" },
      2:    { color: "#FF8800" },
      4:    { color: "#33CC33" },
      8:    { color: "#CC0099" },
      16:   { color: "#3399FF" },
      32:   { color: "#9933FF" },
      64:   { color: "#FF0066" },
      128:  { color: "#00FFCC" },
      256:  { color: "#FFCC00" },
      512:  { color: "#FF6600" },
      1024: { color: "#00FFFF" },
      2048: { color: "#FFD700" },
      // Square numbers (Squares mode)
      9:    { color: "#FFC400" },
      25:   { color: "#00C9A7" },
      36:   { color: "#A64DFF" },
      49:   { color: "#FF9ECF" },
      81:   { color: "#8B5A2B" },
      100:  { color: "#B0BEC5" }
    };
    const FALLBACK_LOOK = { color: "#888888" };

    function makeGrid() {
      return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    }

    // --- MODES ---
    // Doubles: matching blocks merge into double (1+1=2, 2+2=4, ...).
    // Squares: any group of touching blocks that adds up to a square number merges into that square.
    let mode = 'doubles';

    const MODES = {
      doubles: {
        hint: 'Matching blocks merge into double',
        spawn() {                                  // drops 1, 2, or 4
          const rand = Math.random();
          if (rand < 0.6) return 1;
          if (rand < 0.9) return 2;
          return 4;
        }
      },
      squares: {
        hint: 'Touching blocks that add up to a square number merge',
        spawn() {                                  // drops 1, 4, 9, or 16
          const rand = Math.random();
          if (rand < 0.4) return 1;
          if (rand < 0.7) return 4;
          if (rand < 0.9) return 9;
          return 16;
        }
      }
    };

    function getRandomSpawnValue() {
      return MODES[mode].spawn();
    }

    function updateModeUI() {
      document.querySelectorAll('.mode-btn').forEach((btn) => {
        btn.setAttribute('aria-pressed', String(btn.dataset.mode === mode));
      });
      instructionElem.textContent = 'Drag to aim \u2022 Release to drop \u2022 ' + MODES[mode].hint;
    }

    function setMode(next) {
      if (next === mode) return;
      mode = next;
      updateModeUI();
      resetGame();                                 // each mode starts a fresh game
    }

    // --- SHAPES ---
    // Every number is built from that many squares, like the Numberblocks:
    // 1 is one square, 2 is two stacked, 4 is a 2x2, 8 is a 2x4, 9 is a 3x3, 16 is a 4x4 ...
    const shapeCache = new Map();

    function shapeFor(n) {
      if (shapeCache.has(n)) return shapeCache.get(n);
      const k = Math.log2(n);
      const h = Number.isInteger(k)
        ? n / Math.pow(2, Math.floor(k / 2))          // powers of two: square, then a tall rectangle
        : Math.ceil(n / Math.floor(Math.sqrt(n)));    // any other number: fill column by column
      const cells = [];
      for (let i = 0; i < n; i++) {
        cells.push([h - 1 - (i % h), Math.floor(i / h)]);   // [row, col], top-left origin
      }
      const shape = { cells, w: Math.ceil(n / h), h };
      shapeCache.set(n, shape);
      return shape;
    }

    function turned(shape) {
      return { cells: shape.cells.map(([r, c]) => [c, r]), w: shape.h, h: shape.w };
    }

    function bounds(cells) {
      let minR = Infinity, maxR = -Infinity, minC = Infinity, maxC = -Infinity;
      for (const [r, c] of cells) {
        if (r < minR) minR = r;
        if (r > maxR) maxR = r;
        if (c < minC) minC = c;
        if (c > maxC) maxC = c;
      }
      return { minR, maxR, minC, maxC, w: maxC - minC + 1, h: maxR - minR + 1 };
    }

    // --- JELLY ---
    // Each block is a few damped springs: one squashes it flat and bulges it out,
    // one leans the top sideways, and a faster one adds a wobble on top of that.
    // Bigger blocks wobble more slowly.
    function newJelly(rows) {
      return {
        s: 0, sv: 0, sT: 0,        // squash (+) / stretch (-) as a fraction of height, its speed, its resting target
        sw: 0, swv: 0, swT: 0,     // sideways lean of the top edge (px)
        b: 0, bv: 0,               // faster wobble that bends the top more than the middle
        w: 2 * Math.PI * 4.2 / (1 + 0.35 * Math.log2(Math.max(1, rows)))
      };
    }

    function stepJelly(j, dt) {
      const n = Math.max(1, Math.ceil(dt / 8));          // small sub-steps keep the springs stable
      const h = dt / n / 1000;
      const wSway = j.w * 0.8, wBend = j.w * 1.5;
      for (let i = 0; i < n; i++) {
        j.sv += (-j.w * j.w * (j.s - j.sT) - 2 * 0.10 * j.w * j.sv) * h;
        j.s += j.sv * h;
        j.swv += (-wSway * wSway * (j.sw - j.swT) - 2 * 0.09 * wSway * j.swv) * h;
        j.sw += j.swv * h;
        j.bv += (-wBend * wBend * j.b - 2 * 0.12 * wBend * j.bv) * h;
        j.b += j.bv * h;
      }
      j.sv = Math.max(-16, Math.min(16, j.sv));
      j.s = Math.max(-0.28, Math.min(0.34, j.s));
      j.swv = Math.max(-420, Math.min(420, j.swv));
      j.sw = Math.max(-22, Math.min(22, j.sw));
      j.bv = Math.max(-420, Math.min(420, j.bv));
      j.b = Math.max(-16, Math.min(16, j.b));
    }

    // Which blocks touch this one, and on which side.
    function touching(p) {
      const found = { below: new Set(), above: new Set(), left: new Set(), right: new Set() };
      for (const [r, c] of p.cells) {
        for (const [rr, cc, side] of [[r + 1, c, 'below'], [r - 1, c, 'above'], [r, c - 1, 'left'], [r, c + 1, 'right']]) {
          if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS) continue;
          const id = grid[rr][cc];
          if (id && id !== p.id) found[side].add(id);
        }
      }
      return found;
    }

    // A bump ripples into the blocks it touches: the block underneath gets squished,
    // the ones beside it get shoved away. Heavier blocks shove lighter ones harder.
    function bumpNeighbors(p, strength) {
      const t = touching(p);
      const kick = (id, squash, sway) => {
        const q = pieces.get(id);
        if (!q) return;
        const m = Math.min(1.6, Math.max(0.5, Math.sqrt(p.value / q.value)));
        q.j.sv += KICK_SQUASH * squash * strength * m * JELLY;
        q.j.swv += KICK_SWAY * sway * strength * m * JELLY;
        q.j.bv += KICK_SWAY * sway * strength * m * 0.5 * JELLY;
      };
      for (const id of t.below) kick(id, 0.55, 0);
      for (const id of t.above) kick(id, 0.35, 0);
      for (const id of t.left) kick(id, 0.2, -0.7);
      for (const id of t.right) kick(id, 0.2, 0.7);
      if (t.left.size) p.j.swv += KICK_SWAY * 0.25 * strength * JELLY;     // the bumped block pushes back
      if (t.right.size) p.j.swv -= KICK_SWAY * 0.25 * strength * JELLY;
    }

    function impact(p, strength) {
      p.j.sv += KICK_SQUASH * strength * JELLY;
      bumpNeighbors(p, strength);
    }

    // Blocks resting on a jelly ride along with its squashing and swaying,
    // so stacks move as one and never gap or overlap.
    function updateRide() {
      const lowestFirst = [...pieces.values()].sort((a, b) =>
        Math.max(...b.cells.map(([r]) => r)) - Math.max(...a.cells.map(([r]) => r)));
      for (const p of lowestFirst) { p.rx = 0; p.ry = 0; }
      for (const p of lowestFirst) {
        let sx = 0, sy = 0, n = 0;
        for (const [r, c] of p.cells) {
          const id = r + 1 < ROWS ? grid[r + 1][c] : 0;
          if (!id || id === p.id) continue;
          const q = pieces.get(id);
          const qb = bounds(q.cells);
          const up = (qb.maxR + 1) * CELL - (r + 1) * CELL;          // height of the contact above q's base
          const t = Math.min(1, Math.max(0, up / (qb.h * CELL)));
          const wide = 1 + q.j.s * (0.3 + 0.5 * Math.sin(Math.PI * t));
          sy += q.j.s * up + q.ry;
          sx += ((c + 0.5) * CELL - (qb.minC + qb.maxC + 1) * CELL / 2) * (wide - 1) + q.j.sw * t + q.j.b * t * t + q.rx;
          n++;
        }
        if (n) { p.rx = sx / n; p.ry = sy / n; }
      }
    }

    // --- PLACEMENT ---
    function fits(cells, row, col) {
      for (const [dr, dc] of cells) {
        const r = row + dr, c = col + dc;
        if (r < 0 || r >= ROWS || c < 0 || c >= COLS || grid[r][c] !== 0) return false;
      }
      return true;
    }

    // Row where a block dropped in this column comes to rest, or -1 if there is no room.
    function landingRow(cells, col) {
      if (!fits(cells, 0, col)) return -1;
      let r = 0;
      while (fits(cells, r + 1, col)) r++;
      return r;
    }

    function addPiece(id, value, cells) {
      const p = { id, value, cells, dy: 0, pop: 0, rx: 0, ry: 0, falling: false, dirty: true, j: newJelly(bounds(cells).h) };
      pieces.set(id, p);
      for (const [r, c] of cells) grid[r][c] = id;
      return p;
    }

    // --- SPAWNING & INPUT ---
    function spawnNextBlock() {
      const value = getRandomSpawnValue();
      const shape = shapeFor(value);
      const center = Math.round((COLS - shape.w) / 2);

      // Start at the middle, or the nearest column where the block fits at the top.
      let col = -1;
      for (let d = 0; d < COLS && col < 0; d++) {
        for (const cand of [center - d, center + d]) {
          if (cand >= 0 && cand <= COLS - shape.w && fits(shape.cells, 0, cand)) { col = cand; break; }
        }
      }
      if (col < 0) { triggerGameOver(); return; }

      active = {
        value, shape, col,
        x: col * CELL,
        y: 0,
        land: landingRow(shape.cells, col),
        j: newJelly(shape.h)
      };
      active.j.sv = 5 * JELLY;              // a little plop when it appears
      phase = 'aim';
    }

    function setActiveCol(col) {
      if (phase !== 'aim' || !active) return;
      active.col = Math.max(0, Math.min(COLS - active.shape.w, col));
      active.land = landingRow(active.shape.cells, active.col);
    }

    function handlePointerMove(clientX) {
      if (phase !== 'aim' || !active) return;
      const rect = canvas.getBoundingClientRect();
      const x = (clientX - rect.left) * (CW / rect.width);
      // Center the block under the finger, then snap to the nearest square.
      setActiveCol(Math.round(x / CELL - active.shape.w / 2));
    }

    function handlePointerRelease() {
      if (phase !== 'aim' || !active) return;
      if (active.land < 0) return;          // no room in this spot
      active.x = active.col * CELL;
      phase = 'drop';
    }

    let pointerIsDown = false;
    canvas.addEventListener('pointerdown', (e) => {
      if (phase !== 'aim') return;
      pointerIsDown = true;
      canvas.setPointerCapture(e.pointerId);
      handlePointerMove(e.clientX);
    });
    canvas.addEventListener('pointermove', (e) => {
      if (pointerIsDown) handlePointerMove(e.clientX);
    });
    canvas.addEventListener('pointerup', () => {
      if (!pointerIsDown) return;
      pointerIsDown = false;
      handlePointerRelease();
    });
    canvas.addEventListener('pointercancel', () => { pointerIsDown = false; });

    // Keyboard: arrows to move, down or space to drop
    window.addEventListener('keydown', (e) => {
      if (e.target.closest && e.target.close
